<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro & Exportador</title>
  <style>
    :root {
      --primary: #00875a; /* Verde Mercado Livre / Financeiro */
      --primary-hover: #006644;
      --bg: #f4f5f7;
      --card-bg: #ffffff;
      --text: #172b4d;
      --text-light: #5e6c84;
      --border: #dfe1e6;
      --success: #36b37e;
      --danger: #ff5630;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      color: var(--primary);
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(9, 30, 66, 0.08);
      border: 1px solid var(--border);
    }

    h2 {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: var(--text);
    }

    /* Formulário */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-light);
    }

    input, select {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    /* Botões */
    .btn {
      padding: 11px 20px;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #ebecf0;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: #dfe1e6;
    }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    /* Tabela */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background-color: #f4f5f7;
      padding: 12px 10px;
      font-weight: 600;
      color: var(--text-light);
      border-bottom: 2px solid var(--border);
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    tr:hover {
      background-color: #fafbfc;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-receita {
      background-color: #e3fcef;
      color: var(--success);
    }

    .badge-despesa {
      background-color: #ffebe6;
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--text-light);
      font-style: italic;
    }

    /* Responsividade */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
      .actions-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <header>
      <h1>Finanças Inteligentes</h1>
      <button class="btn btn-secondary" onclick="exportarParaCSV()">
        📥 Exportar para CSV (Sheets/Looker)
      </button>
    </header>

    <!-- Formulário de Entrada -->
    <section class="card">
      <h2>Novo Lançamento</h2>
      <form id="financeForm" onsubmit="salvarLancamento(event)">
        <div class="form-grid">
          <div class="form-group">
            <label for="data">Data</label>
            <input type="date" id="data" required>
          </div>

          <div class="form-group">
            <label for="tipo">Tipo</label>
            <select id="tipo" required>
              <option value="Despesa">Despesa</option>
              <option value="Receita">Receita</option>
            </select>
          </div>

          <div class="form-group">
            <label for="categoria">Categoria</label>
            <select id="categoria" required>
              <option value="Alimentação">Alimentação</option>
              <option value="Transporte/Combustível">Transporte/Combustível</option>
              <option value="Moradia">Moradia</option>
              <option value="Lazer">Lazer</option>
              <option value="Investimentos">Investimentos</option>
              <option value="Salário/Receita">Salário/Receita</option>
              <option value="Outros">Outros</option>
            </select>
          </div>

          <div class="form-group">
            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" step="0.01" placeholder="0,00" required>
          </div>

          <div class="form-group">
            <label for="metodo">Método de Pagamento</label>
            <select id="metodo" required>
              <option value="Pix">Pix</option>
              <option value="Crédito">Cartão de Crédito</option>
              <option value="Débito">Cartão de Débito</option>
              <option value="Dinheiro">Dinheiro</option>
            </select>
          </div>

          <div class="form-group">
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" placeholder="Ex: Supermercado, posto..." required>
          </div>
        </div>

        <div class="actions-bar">
          <button type="submit" class="btn btn-primary">➕ Adicionar Registro</button>
          <button type="button" class="btn btn-secondary" onclick="limparHistorico()">Limpar Tudo</button>
        </div>
      </form>
    </section>

    <!-- Tabela de Histórico -->
    <section class="card">
      <h2>Histórico Recente</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Tipo</th>
              <th>Categoria</th>
              <th>Descrição</th>
              <th>Método</th>
              <th>Valor</th>
            </tr>
          </thead>
          <tbody id="tabelaCorpo">
            <!-- Inserido via JS -->
          </tbody>
        </table>
        <div id="mensagemVazia" class="empty-state">
          Nenhum lançamento registrado até o momento.
        </div>
      </div>
    </section>

  </div>

  <script>
    // Inicializar data com o dia de hoje por facilidade
    document.getElementById('data').valueAsDate = new Date();

    // Carregar dados iniciais do LocalStorage
    let lancamentos = JSON.parse(localStorage.getItem('meusLancamentos')) || [];

    // Função para renderizar a tabela na tela
    function atualizarTabela() {
      const tabelaCorpo = document.getElementById('tabelaCorpo');
      const mensagemVazia = document.getElementById('mensagemVazia');
      
      tabelaCorpo.innerHTML = '';

      if (lancamentos.length === 0) {
        mensagemVazia.style.display = 'block';
        return;
      }

      mensagemVazia.style.display = 'none';

      // Ordena por data decrescente (mais recente primeiro)
      const lancamentosOrdenados = [...lancamentos].sort((a, b) => new Date(b.data) - new Date(a.data));

      lancamentosOrdenados.forEach(item => {
        const tr = document.createElement('tr');
        
        // Formatar data para padrão brasileiro (DD/MM/AAAA)
        const dataBr = item.data.split('-').reverse().join('/');
        
        // Formatar valor para moeda brasileira
        const valorBr = Number(item.valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        
        const badgeClass = item.tipo === 'Receita' ? 'badge-receita' : 'badge-despesa';

        tr.innerHTML = `
          <td>${dataBr}</td>
          <td><span class="badge ${badgeClass}">${item.tipo}</span></td>
          <td>${item.categoria}</td>
          <td>${item.descricao}</td>
          <td>${item.metodo}</td>
          <td style="font-weight: 600; color: ${item.tipo === 'Receita' ? 'var(--success)' : 'var(--text)'}">${valorBr}</td>
        `;
        tabelaCorpo.appendChild(tr);
      });
    }

    // Função executada ao enviar o formulário
    function salvarLancamento(event) {
      event.preventDefault();

      const novoLancamento = {
        id: Date.now(),
        data: document.getElementById('data').value,
        tipo: document.getElementById('tipo').value,
        categoria: document.getElementById('categoria').value,
        valor: parseFloat(document.getElementById('valor').value),
        metodo: document.getElementById('metodo').value,
        descricao: document.getElementById('descricao').value
      };

      lancamentos.push(novoLancamento);
      localStorage.setItem('meusLancamentos', JSON.stringify(lancamentos));
      
      // Resetar formulário (mantendo a data de hoje)
      document.getElementById('valor').value = '';
      document.getElementById('descricao').value = '';
      document.getElementById('data').valueAsDate = new Date();

      atualizarTabela();
    }

    // Função para resetar o LocalStorage
    function limparHistorico() {
      if (confirm("Tem certeza que deseja apagar TODOS os seus lançamentos? Essa ação não pode ser desfeita.")) {
        lancamentos = [];
        localStorage.removeItem('meusLancamentos');
        atualizarTabela();
      }
    }

    // A MÁGICA DA EXPORTAÇÃO COMPATÍVEL COM EXCEL/LOOKER STUDIO BRASILEIRO
    function exportarParaCSV() {
      if (lancamentos.length === 0) {
        alert("Adicione pelo menos um lançamento antes de exportar.");
        return;
      }

      // 1. Cabeçalho formatado para as colunas
      const cabecalhos = ["Data", "Tipo", "Categoria", "Descricao", "MetodoPagamento", "Valor"];
      
      // 2. Transforma cada objeto em uma linha de texto separada por ponto e vírgula (;)
      const linhas = lancamentos.map(item => {
        // Formata o valor com vírgula para casas decimais (Ex: 150.50 vira 150,50)
        const valorFormatado = String(item.valor).replace('.', ',');
        
        return [
          item.data || '',
          item.tipo || '',
          item.categoria || '',
          `"${(item.descricao || '').replace(/"/g, '""')}"`, // Garante que aspas na descrição não quebrem o CSV
          item.metodo || '',
          valorFormatado
        ].join(';');
      });

      // Une cabeçalhos e linhas com quebras de linha padrão do Windows (\r\n)
      const conteudoCSV = [cabecalhos.join(';'), ...linhas].join('\r\n');

      // 3. Define a codificação UTF-8 com o BOM (\ufeff) para que acentos fiquem perfeitos no Excel nacional
      const blob = new Blob(["\ufeff" + conteudoCSV], { type: 'text/csv;charset=utf-8;' });
      
      // 4. Cria e força o clique no link de download oculto
      const link = document.createElement("a");
      if (link.download !== undefined) {
        const url = URL.createObjectURL(blob);
        const dataHoje = new Date().toISOString().split('T')[0];
        
        link.setAttribute("href", url);
        link.setAttribute("download", `meus_lancamentos_${dataHoje}.csv`);
        link.style.visibility = 'hidden';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }

    // Executar renderização ao carregar a página pela primeira vez
    atualizarTabela();
  </script>

</body>
</html>
