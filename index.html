<!-- Botão para adicionar na sua aba de Configurações -->
<button id="btnExportar" class="btn-primary" onclick="exportarParaCSV()">
  Exportar Lançamentos (CSV)
</button>

<script>
// Função para disparar o download do arquivo CSV
function exportarParaCSV() {
  // 1. Recupere seus dados (ex: do localStorage ou do seu estado global)
  // Substitua 'meusLancamentos' pela variável real que guarda seus registros
  const lancamentos = JSON.parse(localStorage.getItem('meusLancamentos')) || [];

  if (lancamentos.length === 0) {
    alert("Nenhum lançamento encontrado para exportar.");
    return;
  }

  // 2. Defina os cabeçalhos das colunas (Layout padrão para o Sheets/Looker Studio)
  const cabecalhos = ["Data", "Categoria", "Descricao", "Valor", "Tipo", "MetodoPagamento"];
  
  // 3. Mapeie os dados para o formato de linhas separadas por ponto e vírgula (;)
  const linhas = lancamentos.map(item => {
    return [
      item.data || '',
      item.categoria || '',
      `"${(item.descricao || '').replace(/"/g, '""')}"`, // Protege descrições com aspas
      String(item.valor || 0).replace('.', ','), // Converte ponto em vírgula para o padrão BR
      item.tipo || '', // Ex: 'Despesa' ou 'Receita'
      item.metodoPagamento || ''
    ].join(';');
  });

  // Junta o cabeçalho e as linhas com quebra de linha
  const conteudoCSV = [cabecalhos.join(';'), ...linhas].join('\r\n');

  // 4. Cria o arquivo Blob com codificação UTF-8 para garantir acentuação correta
  const blob = new Blob(["\ufeff" + conteudoCSV], { type: 'text/csv;charset=utf-8;' });
  
  // 5. Gera o link temporário e dispara o download automaticamente
  const link = document.createElement("a");
  if (link.download !== undefined) {
    const url = URL.createObjectURL(blob);
    
    // Nome do arquivo com a data atual para melhor organização
    const dataHoje = new Date().toISOString().split('T')[0];
    link.setAttribute("href", url);
    link.setAttribute("download", `lancamentos_financeiros_${dataHoje}.csv`);
    link.style.visibility = 'hidden';
    
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
}
</script>
