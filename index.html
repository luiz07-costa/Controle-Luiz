
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro Luiz v4.0</title>
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- Chart.js para os Dashboards -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-principal: #080808;
            --bg-cards: #141414;
            --bg-inputs: #1f1f1f;
            --cor-ouro: #d4af37;
            --cor-texto: #ffffff;
            --cor-subtexto: #aaaaaa;
            --cor-sucesso: #2ecc71;
            --cor-perigo: #e74c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-principal); color: var(--cor-texto); padding-bottom: 90px; }
        
        header { 
            background: #111; 
            padding: 20px; 
            text-align: center; 
            border-bottom: 2px solid var(--cor-ouro);
            position: sticky; top: 0; z-index: 10;
        }
        header h1 { font-size: 20px; font-weight: 600; color: var(--cor-texto); }

        .container { padding: 20px; max-width: 600px; margin: 0 auto; }

        /* Alerta de Contas Fixas */
        .alerta-fixas { 
            background: #2d2400; 
            border: 1px solid var(--cor-ouro); 
            color: var(--cor-ouro); 
            padding: 15px; 
            border-radius: 12px; 
            font-size: 13px; 
            margin-bottom: 20px; 
            display: none; 
            align-items: center; gap: 10px;
        }

        /* Cards Resumo */
        .grid-resumo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .card { background: var(--bg-cards); padding: 15px; border-radius: 12px; border: 1px solid #222; }
        .card-total { grid-column: span 2; text-align: center; border-left: 4px solid var(--cor-ouro); }
        .card h3 { font-size: 12px; color: var(--cor-subtexto); text-transform: uppercase; letter-spacing: 0.5px; }
        .card p { font-size: 20px; font-weight: 600; margin-top: 5px; }
        
        .lucro { color: var(--cor-sucesso); }
        .despesa { color: var(--cor-perigo); }

        /* Gráficos */
        .chart-container { background: var(--bg-cards); padding: 15px; border-radius: 12px; margin-bottom: 20px; min-height: 250px; }
        .chart-container h3 { font-size: 14px; margin-bottom: 15px; text-align: center; color: var(--cor-subtexto); }

        /* Listas de Histórico */
        .lista-titulo { font-size: 14px; color: var(--cor-subtexto); margin-bottom: 10px; font-weight: 600; }
        .item-historico { 
            background: var(--bg-cards); 
            padding: 12px 15px; 
            border-radius: 10px; 
            margin-bottom: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-left: 4px solid #333;
        }
        .item-historico.tipo-receita { border-left-color: var(--cor-sucesso); }
        .item-historico.tipo-despesa { border-left-color: var(--cor-perigo); }
        .item-info p { font-size: 14px; font-weight: 600; }
        .item-info span { font-size: 11px; color: var(--cor-subtexto); }
        .item-valor { font-weight: 600; font-size: 14px; }

        /* Navegação Inferior */
        nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: #111; display: flex; justify-content: space-around; 
            padding: 12px 0; border-top: 1px solid #222; z-index: 10;
        }
        .nav-btn { background: none; border: none; color: var(--cor-subtexto); font-size: 18px; cursor: pointer; transition: 0.2s; width: auto; padding: 0; margin: 0; }
        .nav-btn.ativo { color: var(--cor-ouro); }

        /* Botão Flutuante (Lançamento) */
        .fab { 
            position: fixed; bottom: 85px; right: 20px; 
            background: var(--cor-ouro); border-radius: 50%; 
            width: 56px; height: 56px; border: none; 
            font-size: 22px; color: #000; cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 9;
        }

        /* Telas e Modais */
        .tela { display: none; }
        .tela.ativa { display: block; }
        
        .modal-bg { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.85); 
            z-index: 100; backdrop-filter: blur(3px);
        }
        .modal-box { 
            background: #161616; margin: 10% auto; padding: 25px; 
            border-radius: 16px; width: 90%; max-width: 400px;
            border: 1px solid #333;
        }
        .modal-box h3 { margin-bottom: 15px; font-size: 18px; text-align: center; }

        /* Elementos de Formulário */
        label { font-size: 12px; color: var(--cor-subtexto); display: block; margin-top: 10px; }
        input, select { 
            width: 100%; padding: 12px; margin-top: 5px; 
            border-radius: 8px; border: 1px solid #333; 
            background: var(--bg-inputs); color: white; font-size: 14px;
        }
        input:focus, select:focus { border-color: var(--cor-ouro); outline: none; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button.action-btn { 
            padding: 12px; border-radius: 8px; border: none; 
            font-weight: 600; font-size: 14px; cursor: pointer; width: 100%;
        }
        button.btn-salvar { background: var(--cor-ouro); color: #000; }
        button.btn-cancelar { background: #333; color: white; }
    </style>
</head>
<body>

<header>
    <h1>Controle Financeiro Luiz</h1>
</header>

<div class="container">
    <!-- Alerta Baseado no Dia 10 -->
    <div id="alerta-fixas" class="alerta-fixas">
        <i class="fa-solid fa-triangle-exclamation fa-lg"></i>
        <span><strong>Atenção (Dia 10):</strong> Suas contas fixas recorrentes fecham ou vencem hoje. Não se esqueça de realizar os lançamentos!</span>
    </div>

    <!-- TELA 1: DASHBOARD -->
    <div id="tela-dashboard" class="tela ativa">
        <div class="grid-resumo">
            <div class="card card-total">
                <h3>Saldo Líquido Atual</h3>
                <p id="txt-saldo">R$ 0,00</p>
            </div>
            <div class="card">
                <h3>Receitas</h3>
                <p id="txt-receitas" class="lucro">R$ 0,00</p>
            </div>
            <div class="card">
                <h3>Despesas</h3>
                <p id="txt-despesas" class="despesa">R$ 0,00</p>
            </div>
        </div>

        <div class="chart-container">
            <h3>Distribuição de Gastos por Macrofluxo</h3>
            <canvas id="chartDespesas"></canvas>
        </div>
    </div>

    <!-- TELA 2: HISTÓRICO COMPLETO -->
    <div id="tela-historico" class="tela">
        <div class="lista-titulo">Fluxo de Caixa Registrado</div>
        <div id="container-historico"></div>
    </div>
</div>

<!-- Botão de Ação Flutuante -->
<button class="fab" onclick="abrirModal()"><i class="fa-solid fa-plus"></i></button>

<!-- Modal de Lançamento Integrado -->
<div id="modal-lancamento" class="modal-bg">
    <div class="modal-box">
        <h3>Novo Lançamento</h3>
        
        <label>Tipo de Operação</label>
        <select id="form-tipo" onchange="alternarTipoOperacao()">
            <option value="Despesa">Despesa</option>
            <option value="Receita">Receita</option>
        </select>

        <label>Categoria</label>
        <select id="form-categoria"></select>

        <label>Valor (R$)</label>
        <input type="number" step="0.01" id="form-valor" placeholder="0,00" required>

        <label id="lbl-pagamento">Forma de Pagamento</label>
        <select id="form-pagamento">
            <option>Pix</option>
            <option>Débito</option>
            <option>Crédito</option>
            <option>Dinheiro</option>
            <option>Boleto</option>
            <option>Débito automático</option>
            <option>V/a</option>
            <option>V/t</option>
        </select>

        <div class="btn-group">
            <button class="action-btn btn-cancelar" onclick="fecharModal()">Cancelar</button>
            <button class="action-btn btn-salvar" onclick="processarSalvar()">Confirmar</button>
        </div>
    </div>
</div>

<!-- Navegação -->
<nav>
    <button id="btn-nav-dash" class="nav-btn ativo" onclick="mudarTela('dashboard')"><i class="fa-solid fa-chart-pie"></i></button>
    <button id="btn-nav-hist" class="nav-btn" onclick="mudarTela('historico')"><i class="fa-solid fa-list-ul"></i></button>
</nav>

<script>
    // Estrutura Estratégica das 28 Categorias de Despesas
    const categoriasDespesas = [
        "Condominio", "Energia", "Água", "Internet", "Plano celular", "Seguro residencial", "Cursos",
        "Combustivel", "Gastos carro", "Ipva", "Seguro carro", "Uber/passagem",
        "Coisas apê", "Compras mês", "Alimentação (dia-a-dia)", "Pessoal (acessórios)", "Corte cabelo", "Outros", "Presentes",
        "Dieta semanal", "Suplementos", "Academia", "Remédio", "Consultas e exames médicos (coparticipação)",
        "Lazer", "You tube", "Aplicação", "Previdência privada"
    ];

    const categoriasReceitas = ["Salário", "Remuneração Variável", "Reembolsos", "Outros Rendimentos"];

    // Base de Dados Persistida Localmente
    let dbTransacoes = JSON.parse(localStorage.getItem('db_transacoes_luiz')) || [];
    let meuGrafico = null;

    // Inicializador do App
    window.onload = function() {
        renderizarCategorias('Despesa');
        verificarAlertaDia10();
        atualizarAplicacao();
    };

    function verificarAlertaDia10() {
        const diaAtual = new Date().getDate();
        if (diaAtual >= 10) {
            document.getElementById('alerta-fixas').style.display = 'flex';
        }
    }

    function renderizarCategorias(tipo) {
        const selectCat = document.getElementById('form-categoria');
        const lista = tipo === 'Despesa' ? categoriasDespesas : categoriasReceitas;
        selectCat.innerHTML = lista.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function alternarTipoOperacao() {
        const tipo = document.getElementById('form-tipo').value;
        const campoPag = document.getElementById('form-pagamento');
        const lblPag = document.getElementById('lbl-pagamento');
        
        renderizarCategorias(tipo);
        
        if (tipo === 'Receita') {
            campoPag.style.display = 'none';
            lblPag.style.display = 'none';
        } else {
            campoPag.style.display = 'block';
            lblPag.style.display = 'block';
        }
    }

    function mudarTela(telaAlvo) {
        document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('ativo'));
        
        if(telaAlvo === 'dashboard') {
            document.getElementById('tela-dashboard').classList.add('ativa');
            document.getElementById('btn-nav-dash').classList.add('ativo');
            atualizarGrafico(); 
        } else {
            document.getElementById('tela-historico').classList.add('ativa');
            document.getElementById('btn-nav-hist').classList.add('ativo');
        }
    }

    function abrirModal() { document.getElementById('modal-lancamento').style.display = 'block'; }
    function fecharModal() { 
        document.getElementById('modal-lancamento').style.display = 'none'; 
        document.getElementById('form-valor').value = '';
    }

    function processarSalvar() {
        const tipo = document.getElementById('form-tipo').value;
        const categoria = document.getElementById('form-categoria').value;
        const valor = parseFloat(document.getElementById('form-valor').value);
        const pagamento = tipo === 'Despesa' ? document.getElementById('form-pagamento').value : 'N/A';
        const data = new Date().toLocaleDateString('pt-BR');

        if (isNaN(valor) || valor <= 0) {
            alert('Por favor, informe um valor de lançamento válido.');
            return;
        }

        const novaTransacao = { tipo, categoria, valor, pagamento, data, timestamp: Date.now() };
        dbTransacoes.push(novaTransacao);
        localStorage.setItem('db_transacoes_luiz', JSON.stringify(dbTransacoes));
        
        atualizarAplicacao();
        fecharModal();
    }

    function deletarItem(timestamp) {
        if(confirm("Deseja realmente remover este lançamento da sua base de dados?")) {
            dbTransacoes = dbTransacoes.filter(item => item.timestamp !== timestamp);
            localStorage.setItem('db_transacoes_luiz', JSON.stringify(dbTransacoes));
            atualizarAplicacao();
        }
    }

    function atualizarAplicacao() {
        let somatorioReceitas = 0;
        let somatorioDespesas = 0;
        const containerHist = document.getElementById('container-historico');
        
        containerHist.innerHTML = '';

        // Ordenação cronológica invertida (mais recentes primeiro)
        const listaOrdenada = [...dbTransacoes].sort((a,b) => b.timestamp - a.timestamp);

        listaOrdenada.forEach(item => {
            if (item.tipo === 'Receita') somatorioReceitas += item.valor;
            if (item.tipo === 'Despesa') somatorioDespesas += item.valor;

            const classeCor = item.tipo === 'Receita' ? 'tipo-receita' : 'tipo-despesa';
            const detalhePagamento = item.tipo === 'Despesa' ? ` • ${item.pagamento}` : '';
            
            containerHist.innerHTML += `
                <div class="item-historico ${classeCor}">
                    <div class="item-info">
                        <p>${item.categoria}</p>
                        <span>${item.data}${detalhePagamento}</span>
                    </div>
                    <div class="item-valor" style="display:flex; align-items:center; gap: 10px;">
                        <span class="${classeCor}">${item.tipo === 'Receita' ? '+' : '-'} R$ ${item.valor.toFixed(2)}</span>
                        <i class="fa-solid fa-trash-can" style="color: #555; cursor:pointer;" onclick="deletarItem(${item.timestamp})"></i>
                    </div>
                </div>`;
        });

        const saldoLiquido = somatorioReceitas - somatorioDespesas;

        // Atualização da UI textual
        document.getElementById('txt-receitas').innerText = `R$ ${somatorioReceitas.toFixed(2)}`;
        document.getElementById('txt-despesas').innerText = `R$ ${somatorioDespesas.toFixed(2)}`;
        
        const txtSaldo = document.getElementById('txt-saldo');
        txtSaldo.innerText = `R$ ${saldoLiquido.toFixed(2)}`;
        txtSaldo.className = saldoLiquido >= 0 ? 'lucro' : 'despesa';

        atualizarGrafico();
    }

    function atualizarGrafico() {
        const ctx = document.getElementById('chartDespesas').getContext('2d');
        
        // Mapeamento dos Gastos Totais agregados por categoria
        const mapaAgregado = {};
        categoriasDespesas.forEach(cat => mapaAgregado[cat] = 0);
        
        dbTransacoes.filter(t => t.tipo === 'Despesa').forEach(t => {
            if(mapaAgregado[t.categoria] !== undefined) {
                mapaAgregado[t.categoria] += t.valor;
            }
        });

        // Filtrando para exibir apenas categorias que possuem movimentações reais
        const categoriasFiltradas = Object.keys(mapaAgregado).filter(cat => mapaAgregado[cat] > 0);
        const valoresFiltrados = categoriasFiltradas.map(cat => mapaAgregado[cat]);

        if (meuGrafico) meuGrafico.destroy();

        if(valoresFiltrados.length === 0) {
            ctx.clearRect(0, 0, 400, 400);
            return;
        }

        meuGrafico = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: categoriasFiltradas,
                datasets: [{
                    data: valoresFiltrados,
                    backgroundColor: [
                        '#d4af37', '#f39c12', '#2ecc71', '#3498db', '#9b59b6', '#e74c3c', '#1abc9c',
                        '#e67e22', '#34495e', '#f1c40f', '#16a085', '#27ae60', '#2980b9', '#8e44ad'
                    ],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: { color: '#fff', font: { size: 10 } }
                    }
                }
            }
        });
    }
</script>
</body>
</html>
